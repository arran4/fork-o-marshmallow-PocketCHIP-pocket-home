# Agent rules for generation (trigger build check for PR #18):
# https://arran4.github.io/blog/post/2026/006-github-ci-and-deploy/
# Built using this post as a reference/guide.
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 19 1 * *'
    - cron: '0 19 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  discussions: write
  pull-requests: write
  checks: write
  security-events: write
  pages: write

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          is_monthly=false
          is_nightly=false

          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                run_release=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                run_pr_meta_checks=true
                run_code_checks=true
              fi
              ;;
            release)
              run_release=true
              run_code_checks=true
              ;;
            workflow_dispatch)
              run_code_checks=true
              INPUT_MODE="${{ inputs.mode }}"
              if [[ -z "$INPUT_MODE" ]]; then
                INPUT_MODE="${{ github.event.inputs.mode }}"
              fi
              if [[ "$INPUT_MODE" == release-* ]]; then
                run_release=true
              fi
              if [[ "$INPUT_MODE" == "monthly-maintenance" ]]; then
                is_monthly=true
              fi
              if [[ "$INPUT_MODE" == "lint-fix" ]]; then
                is_nightly=true
              fi
              ;;
            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "0 19 1 * *" ]]; then
                is_monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "0 19 * * *" ]]; then
                is_nightly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  c-make-build-test:
    name: Build & Test (Debian Jessie ARM)
    needs: [route]
    if: ${{ always() && (needs.route.outputs.run_code_checks == 'true' || needs.route.outputs.run_release == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build and Test in Target Container
        uses: uraimo/run-on-arch-action@v2
        id: build
        with:
          arch: armv7
          distro: none
          base_image: arm32v7/debian:jessie
          env: |
            TAG: ${{ github.ref_name }}
          install: |
            cat << 'EOF' > /etc/apt/sources.list
            deb http://archive.debian.org/debian jessie main
            deb http://archive.debian.org/debian-security jessie/updates main
            EOF
            echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
            apt-get update -o Acquire::Check-Valid-Until=false || true
            apt-get install -y --force-yes build-essential git libasound2-dev libx11-dev libxrandr-dev libxcursor-dev libxft-dev libxinerama-dev libnm-glib-dev network-manager-dev libi2c-dev libssl-dev pkg-config dos2unix libfreetype6-dev i2c-tools patch
          run: |
            set -euo pipefail
            git config --global --add safe.directory '*' || true
            dos2unix deps/JUCE/modules/juce_graphics/colour/juce_PixelFormats.h deps/JUCE/modules/juce_gui_basics/mouse/juce_LassoComponent.h || true
            (cd deps/JUCE && git apply --ignore-space-change --ignore-whitespace ../../patches/juce_arm_gcc.patch)
            sed -i "s/#define JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS 1/#define JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS 0/g" deps/JUCE/modules/juce_core/system/juce_CompilerSupport.h
            sed -i "s/JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS/0/g" deps/JUCE/modules/juce_core/containers/juce_Array.h
            sed -i "s/JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS/0/g" deps/JUCE/modules/juce_core/text/juce_StringArray.h
            sed -i "s/JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS/0/g" deps/JUCE/modules/juce_core/text/juce_StringArray.cpp
            if [[ "$TAG" == *"-test"* || "$TAG" == *"-rc"* || "$TAG" == *"-alpha"* || "$TAG" == *"-snapshot"* || "$TAG" == *"-debug"* ]]; then
              make CONFIG=ReleaseDebug
              make wifitest CONFIG=ReleaseDebug
            else
              make CONFIG=Release
              make wifitest CONFIG=Release
            fi

  prepare-release-tag:
    name: Prepare release tag
    needs: [route]
    if: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'release-')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      next_version: ${{ steps.tag.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master") ]]; then
            MODE="release-patch"
            OVERRIDE=""
          else
            MODE="${{ inputs.mode }}"
            OVERRIDE="${{ inputs.release_version_override }}"
          fi

          if [[ -n "$OVERRIDE" ]]; then
            OVERRIDE="${OVERRIDE#v}"
            next_tag="v$OVERRIDE"
          else
            case "$MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *) echo "Unsupported release mode: $MODE"; exit 1 ;;
            esac
            if command -v git-tag-inc >/dev/null 2>&1; then
              level="${level#-}"
              args=(-print-version-only "$level")
              [[ -n "$suffix" ]] && args+=("$suffix")
              next_tag=$(git-tag-inc "${args[@]}")
            else
              git fetch --tags --force
              latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)
              [[ -z "$latest" ]] && latest='0.0.0'

              if command -v npx >/dev/null 2>&1; then
                case "$level" in
                  major) bumped=$(npx --yes semver "$latest" -i major) ;;
                  minor) bumped=$(npx --yes semver "$latest" -i minor) ;;
                  *) bumped=$(npx --yes semver "$latest" -i patch) ;;
                esac
                next_tag="v${bumped}"
              else
                base="${latest%%-*}"
                IFS='.' read -r maj min pat <<< "$base"
                case "$level" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  *) pat=$((pat+1)) ;;
                esac
                next_tag="v${maj}.${min}.${pat}"
              fi

              if [[ -n "$suffix" ]]; then
                next_tag="${next_tag}-${suffix}.1"
              fi
            fi
          fi

          [[ "$next_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Invalid tag format: $next_tag" >&2
            exit 1
          }
          git fetch --tags --force
          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag already exists: $next_tag" >&2
            echo "Choose a new mode or set release_version_override." >&2
            exit 1
          fi

          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"
          clean_tag="${next_tag#v}"; clean_tag="${clean_tag%%-*}"
          IFS='.' read -r maj min pat <<< "$clean_tag"
          echo "next_version=${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-SNAPSHOT" >> "$GITHUB_OUTPUT"

  build-release-deb:
    name: Build Debian Release Package
    needs: [route, c-make-build-test, prepare-release-tag]
    if: ${{ always() && needs.c-make-build-test.result == 'success' && (needs.prepare-release-tag.result == 'success' || needs.prepare-release-tag.result == 'skipped') && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build and Package
        uses: uraimo/run-on-arch-action@v2
        id: build
        with:
          arch: armv7
          distro: none
          base_image: arm32v7/debian:jessie
          env: |
            TAG: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))) && needs.prepare-release-tag.outputs.release_tag || github.ref_name }}
          install: |
            cat << 'EOF' > /etc/apt/sources.list
            deb http://archive.debian.org/debian jessie main
            deb http://archive.debian.org/debian-security jessie/updates main
            EOF
            echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
            apt-get update -o Acquire::Check-Valid-Until=false || true
            apt-get install -y --force-yes build-essential git libasound2-dev libx11-dev libxrandr-dev libxcursor-dev libxft-dev libxinerama-dev libnm-glib-dev network-manager-dev libi2c-dev libssl-dev pkg-config fakeroot debhelper dos2unix libfreetype6-dev i2c-tools patch
          run: |
            set -euo pipefail
            git config --global --add safe.directory '*' || true
            dos2unix deps/JUCE/modules/juce_graphics/colour/juce_PixelFormats.h deps/JUCE/modules/juce_gui_basics/mouse/juce_LassoComponent.h || true
            (cd deps/JUCE && git apply --ignore-space-change --ignore-whitespace ../../patches/juce_arm_gcc.patch)
            sed -i "s/#define JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS 1/#define JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS 0/g" deps/JUCE/modules/juce_core/system/juce_CompilerSupport.h
            sed -i "s/JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS/0/g" deps/JUCE/modules/juce_core/containers/juce_Array.h
            sed -i "s/JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS/0/g" deps/JUCE/modules/juce_core/text/juce_StringArray.h
            sed -i "s/JUCE_COMPILER_SUPPORTS_INITIALIZER_LISTS/0/g" deps/JUCE/modules/juce_core/text/juce_StringArray.cpp
            if [[ "$TAG" == *"-test"* || "$TAG" == *"-rc"* || "$TAG" == *"-alpha"* || "$TAG" == *"-snapshot"* || "$TAG" == *"-debug"* ]]; then
              make CONFIG=ReleaseDebug
              make wifitest CONFIG=ReleaseDebug
            else
              make CONFIG=Release
              make wifitest CONFIG=Release
            fi
            if [ -n "$TAG" ]; then
              VERSION="${TAG#v}"
              sed -i "1s/([^)]*)/($VERSION)/" debian/changelog
            fi

            if [[ "$TAG" == *"-test"* || "$TAG" == *"-rc"* || "$TAG" == *"-alpha"* || "$TAG" == *"-snapshot"* || "$TAG" == *"-debug"* ]]; then
              echo "" >> debian/rules
              echo "override_dh_auto_build:" >> debian/rules
              printf "\ttrue\n" >> debian/rules
              sed -i 's/build\/Release\/pocket-home/build\/ReleaseDebug\/pocket-home/g' debian/install

              sed -i '/override_dh_strip:/,+1d' debian/rules
              echo "" >> debian/control
              echo "Package: pocket-home-dbg" >> debian/control
              echo "Architecture: armhf" >> debian/control
              echo 'Depends: pocket-home (= ${binary:Version}), ${misc:Depends}' >> debian/control
              echo "Description: debugging symbols for pocket-home" >> debian/control
              echo " This package contains the debugging symbols for pocket-home." >> debian/control
            else
              echo "" >> debian/rules
              echo "override_dh_auto_build:" >> debian/rules
              printf "\ttrue\n" >> debian/rules
            fi

            dpkg-buildpackage -nc -aarmhf -us -uc -b

            # Build the source package
            dpkg-buildpackage -nc -S -us -uc || true

            mkdir -p out
            cp ../pocket-home*.deb out/
            cp ../pocket-home*.dsc out/ || true
            cp ../pocket-home*.tar.* out/ || true
            cp ../pocket-home*_source.changes out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-home-deb
          retention-days: 1
          path: |
            out/pocket-home*.deb
            out/pocket-home*.dsc
            out/pocket-home*.tar.*
            out/pocket-home*_source.changes

      - name: Sync version source and tag commit
        if: ${{ (github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'release-')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.prepare-release-tag.outputs.release_tag }}"

          # Don't overwrite stable tags in git if it's a test/debug release mode,
          # just use the branch reference.
          if [[ "$RELEASE_TAG" == *"-test"* || "$RELEASE_TAG" == *"-rc"* || "$RELEASE_TAG" == *"-alpha"* || "$RELEASE_TAG" == *"-snapshot"* || "$RELEASE_TAG" == *"-debug"* ]]; then
             echo "Skipping git branch version bump and stable tag overwrite for non-stable build ($RELEASE_TAG)."
             # We still want to tag the specific test release, but not commit/push it back
             # to the stable main branch history rewriting the changelog.
             git tag -f "$RELEASE_TAG"
             git push -f origin "$RELEASE_TAG" || { sleep 2; git push -f origin "$RELEASE_TAG"; }
             exit 0
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"

          # Update changelog
          sed -i "1s/([^)]*)/($RELEASE_VERSION)/" debian/changelog

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit and push, handling race conditions from concurrent pushes
          git add debian/changelog
          git commit -m "chore: bump release version to $RELEASE_VERSION"
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push origin "HEAD:${GITHUB_REF#refs/heads/}"; then
              break
            else
              echo "Push failed, attempting to pull with rebase..."
              git pull --rebase origin "${GITHUB_REF#refs/heads/}"
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 5
            fi
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Failed to push after $MAX_RETRIES attempts."
            exit 1
          fi

          # Tag and push tag
          git tag -f "$RELEASE_TAG"
          git push -f origin "$RELEASE_TAG" || { sleep 2; git push -f origin "$RELEASE_TAG"; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))) && needs.prepare-release-tag.outputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.mode }}" in
              release-test|release-rc|release-alpha) prerelease="--prerelease" ;;
            esac
          elif [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master") ]]; then
            prerelease=""
          fi

          # Use Announcement category if possible, else standard notes
          # Also upload source artifacts if they exist
          gh release create "$TAG" out/* --generate-notes $prerelease --discussion-category Announcements || \
            gh release create "$TAG" out/* --generate-notes $prerelease || \
            gh release upload "$TAG" out/* --clobber || true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Setup GPG
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate APT Repository
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

          git clone https://github.com/arran4/fork-mdtohtml.git /tmp/fork-mdtohtml
          go build -C /tmp/fork-mdtohtml -o mdtohtml .

          mkdir -p deploy/archive
          if [ -d "gh-pages/archive" ]; then
            cp -a gh-pages/archive/. deploy/archive/ || true
          fi

          mkdir -p deploy/archive/conf
          cat << REPOCONF > deploy/archive/conf/distributions
          Codename: jessie
          Components: main
          Architectures: armhf
          SignWith: ${{ steps.import-gpg.outputs.fingerprint }}
          REPOCONF

          reprepro -b deploy/archive includedeb jessie out/*.deb
          gpg --armor --export ${{ steps.import-gpg.outputs.fingerprint }} > deploy/archive/public.key

          /tmp/fork-mdtohtml/mdtohtml README.md > deploy/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
